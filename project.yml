name: otherworldweather
options:
  bundleIdPrefix: com.robleto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  otherworldweather:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: otherworldweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.otherworldweather
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: otherworldweather/Info.plist
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Config/otherworldweather.entitlements
    info:
      path: otherworldweather/Info.plist
      properties:
        CFBundleDisplayName: "Otherworld"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # The app's layout (full-bleed portrait planet art, vertically
        # stacked text) is portrait-only by design. iOS requires supporting
        # every orientation UNLESS the app opts into "requires full screen" —
        # this is that opt-in, and it's what silences the Xcode warning
        # "All interface orientations must be supported unless the app
        # requires full screen."
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Otherworld Weather uses your location to show today's forecast and match it to a world."
        OPENWEATHERMAP_API_KEY: "$(OPENWEATHERMAP_API_KEY)"
        UIAppFonts:
          - PoiretOne-Regular.ttf
          - RussoOne-Regular.ttf
fileGroups:
  - Config/otherworldweather.entitlements
  - StoreKitConfig/Products.storekit
schemes:
  otherworldweather:
    build:
      targets:
        otherworldweather: all
    run:
      config: Debug
      storeKitConfiguration: StoreKitConfig/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
