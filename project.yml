name: StarWarsWeather
options:
  bundleIdPrefix: com.robleto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  StarWarsWeather:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: StarWarsWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.starwarsweather
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: StarWarsWeather/Info.plist
        ENABLE_PREVIEWS: YES
    info:
      path: StarWarsWeather/Info.plist
      properties:
        CFBundleDisplayName: "SW Weather"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # The app's layout (full-bleed portrait planet art, vertically
        # stacked text) is portrait-only by design. iOS requires supporting
        # every orientation UNLESS the app opts into "requires full screen" —
        # this is that opt-in, and it's what silences the Xcode warning
        # "All interface orientations must be supported unless the app
        # requires full screen."
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Star Wars Weather uses your location to show today's forecast and match it to a planet."
        OPENWEATHERMAP_API_KEY: "$(OPENWEATHERMAP_API_KEY)"
        UIAppFonts:
          - PoiretOne-Regular.ttf
          - RussoOne-Regular.ttf
