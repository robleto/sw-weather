name: galacticweather
options:
  bundleIdPrefix: com.robleto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
targets:
  galacticweather:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: galacticweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.galacticweather
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: galacticweather/Info.plist
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Config/galacticweather.entitlements
    info:
      path: galacticweather/Info.plist
      properties:
        CFBundleDisplayName: "Galactic Weather"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # The app's layout (full-bleed portrait planet art, vertically
        # stacked text) is portrait-only by design. iOS requires supporting
        # every orientation UNLESS the app opts into "requires full screen" —
        # this is that opt-in, and it's what silences the Xcode warning
        # "All interface orientations must be supported unless the app
        # requires full screen."
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: "Galactic Weather uses your location to show today's forecast and match it to a world."
        OPENWEATHERMAP_API_KEY: "$(OPENWEATHERMAP_API_KEY)"
        UIAppFonts:
          - PoiretOne-Regular.ttf
          - RussoOne-Regular.ttf
  galacticweatherTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: galacticweatherTests
      # The cross-platform parity fixture, shared with the web app's vitest
      # suite. Referenced in place rather than copied into the iOS tree, so the
      # bundled copy is regenerated from the real file on every build and the
      # two platforms cannot be checked against different versions of it.
      - path: ../../shared/weather-slot-matrix.json
        buildPhase: resources
    dependencies:
      - target: galacticweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.galacticweatherTests
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
fileGroups:
  - Config/galacticweather.entitlements
  - StoreKitConfig/Products.storekit
schemes:
  galacticweather:
    build:
      targets:
        galacticweather: all
        galacticweatherTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKitConfig/Products.storekit
    test:
      config: Debug
      targets:
        - galacticweatherTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
