<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Galactic Weather — Concept D: Storm Eye</title>
  <defs>
    <linearGradient id="D_space" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.6" stop-color="#0A0E22"/>
      <stop offset="1" stop-color="#1C0C2E"/>
    </linearGradient>
    <radialGradient id="D_body" cx="0.28" cy="0.22" r="0.95">
      <stop offset="0" stop-color="#FFE0A4"/>
      <stop offset="0.34" stop-color="#F5B45E"/>
      <stop offset="0.66" stop-color="#D2762F"/>
      <stop offset="0.88" stop-color="#8A3220"/>
      <stop offset="1" stop-color="#3A1114"/>
    </radialGradient>
    <radialGradient id="D_storm" cx="0.44" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#FFE2CC"/>
      <stop offset="0.22" stop-color="#EE8B52"/>
      <stop offset="0.58" stop-color="#C3402A"/>
      <stop offset="1" stop-color="#8A2318"/>
    </radialGradient>
    <linearGradient id="D_rim" x1="0.05" y1="0.05" x2="0.95" y2="0.95">
      <stop offset="0" stop-color="#E8F4FF" stop-opacity="0.9"/>
      <stop offset="0.38" stop-color="#C4E2FF" stop-opacity="0.4"/>
      <stop offset="0.7" stop-color="#A8CCFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A8CCFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="D_disc">
      <circle cx="494" cy="544" r="462"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#05070A"/>
  <rect width="1024" height="1024" fill="url(#D_space)"/>

  <g fill="#EAF2FF">
    <circle cx="884" cy="96" r="5" opacity="0.85"/>
    <circle cx="962" cy="222" r="3.5" opacity="0.6"/>
    <circle cx="790" cy="52" r="3" opacity="0.5"/>
    <circle cx="946" cy="386" r="3.5" opacity="0.45"/>
    <circle cx="86" cy="88" r="4" opacity="0.6"/>
    <circle cx="200" cy="46" r="3" opacity="0.4"/>
  </g>

  <!-- the world itself, filling most of the frame so it survives 40px -->
  <circle cx="494" cy="544" r="462" fill="url(#D_body)"/>

  <!-- banded atmosphere: lens-shaped ellipses clipped to the sphere -->
  <g clip-path="url(#D_disc)">
    <ellipse cx="494" cy="188" rx="620" ry="52" fill="#FBE3B4" opacity="0.55"/>
    <ellipse cx="494" cy="300" rx="620" ry="40" fill="#C4602C" opacity="0.45"/>
    <ellipse cx="494" cy="392" rx="620" ry="30" fill="#FFEBC4" opacity="0.4"/>
    <ellipse cx="494" cy="486" rx="620" ry="46" fill="#A84A26" opacity="0.35"/>
    <ellipse cx="494" cy="762" rx="620" ry="58" fill="#8E3A22" opacity="0.4"/>
    <ellipse cx="494" cy="878" rx="620" ry="46" fill="#FFD9A0" opacity="0.22"/>

    <!-- the storm: literally weather, on another world -->
    <g transform="rotate(-8 386 636)">
      <ellipse cx="386" cy="636" rx="152" ry="94" fill="url(#D_storm)"/>
      <ellipse cx="386" cy="636" rx="152" ry="94" fill="none"
               stroke="#FFE8CE" stroke-width="7" opacity="0.45"/>
      <ellipse cx="386" cy="636" rx="74" ry="44" fill="none"
               stroke="#FFF0DC" stroke-width="6" opacity="0.35"/>
    </g>
  </g>

  <!-- rim light on the lit limb, fading to nothing on the terminator side -->
  <circle cx="494" cy="544" r="462" fill="none" stroke="url(#D_rim)" stroke-width="12"/>
</svg>
