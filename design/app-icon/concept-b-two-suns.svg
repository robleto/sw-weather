<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Galactic Weather — Concept B: Two Suns</title>
  <defs>
    <linearGradient id="B_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A82A0C"/>
      <stop offset="0.3" stop-color="#D9450F"/>
      <stop offset="0.62" stop-color="#F4761A"/>
      <stop offset="0.86" stop-color="#FFA832"/>
      <stop offset="1" stop-color="#FFC957"/>
    </linearGradient>
    <radialGradient id="B_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3CE" stop-opacity="0.6"/>
      <stop offset="0.42" stop-color="#FFE08A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFD070" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="B_sun" cx="0.4" cy="0.34" r="0.78">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#FFF8E2"/>
      <stop offset="1" stop-color="#FFEDBE"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" fill="#A82A0C"/>
  <rect width="1024" height="1024" fill="url(#B_sky)"/>

  <!-- two suns, near-equal and clearly separated so they read as a pair
       rather than as an accidental overlap -->
  <circle cx="352" cy="336" r="300" fill="url(#B_glow)"/>
  <circle cx="688" cy="300" r="250" fill="url(#B_glow)"/>
  <circle cx="352" cy="336" r="134" fill="url(#B_sun)"/>
  <circle cx="688" cy="300" r="102" fill="url(#B_sun)"/>

  <!-- one cloud, no dunes: solid fill across overlapping shapes so there are
       no seams, and a fully rounded base instead of a hard horizontal cut -->
  <g fill="#FDF4E0">
    <rect x="228" y="646" width="540" height="104" rx="52"/>
    <circle cx="336" cy="616" r="106"/>
    <circle cx="470" cy="568" r="132"/>
    <circle cx="606" cy="600" r="114"/>
    <circle cx="702" cy="642" r="88"/>
  </g>
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="470" cy="546" r="96"/>
    <circle cx="360" cy="596" r="66"/>
  </g>
</svg>
