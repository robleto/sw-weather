<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Galactic Weather — Concept C: Ringed World</title>
  <defs>
    <linearGradient id="C_space" x1="0.2" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#05070A"/>
      <stop offset="0.55" stop-color="#0B1026"/>
      <stop offset="1" stop-color="#221036"/>
    </linearGradient>
    <radialGradient id="C_wash" cx="0.78" cy="0.16" r="0.62">
      <stop offset="0" stop-color="#FF9A3C" stop-opacity="0.38"/>
      <stop offset="0.5" stop-color="#B0407A" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#3A1050" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="C_planet" cx="0.3" cy="0.24" r="0.92">
      <stop offset="0" stop-color="#FFD98C"/>
      <stop offset="0.32" stop-color="#F0A046"/>
      <stop offset="0.62" stop-color="#C55A2A"/>
      <stop offset="0.85" stop-color="#7A2A24"/>
      <stop offset="1" stop-color="#2E0E16"/>
    </radialGradient>
    <linearGradient id="C_ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F6E4C0" stop-opacity="0.25"/>
      <stop offset="0.28" stop-color="#FFF6E2" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#EBD3AC" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C9A87E" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="C_sun" cx="0.42" cy="0.36" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#FFF0C0"/>
      <stop offset="1" stop-color="#FFC258"/>
    </radialGradient>
    <radialGradient id="C_sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD98A" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#FF9E45" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FF8A2A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="C_disc">
      <circle cx="500" cy="536" r="272"/>
    </clipPath>
    <clipPath id="C_front">
      <rect x="-200" y="560" width="1424" height="700"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#05070A"/>
  <rect width="1024" height="1024" fill="url(#C_space)"/>
  <rect width="1024" height="1024" fill="url(#C_wash)"/>

  <g fill="#EAF2FF">
    <circle cx="110" cy="128" r="4.5" opacity="0.8"/>
    <circle cx="238" cy="72" r="3" opacity="0.55"/>
    <circle cx="80" cy="286" r="3.5" opacity="0.5"/>
    <circle cx="152" cy="880" r="4" opacity="0.65"/>
    <circle cx="300" cy="952" r="3" opacity="0.45"/>
    <circle cx="906" cy="806" r="4.5" opacity="0.7"/>
    <circle cx="962" cy="640" r="3" opacity="0.5"/>
    <circle cx="836" cy="930" r="3.5" opacity="0.55"/>
    <circle cx="66" cy="620" r="3" opacity="0.4"/>
  </g>

  <!-- distant sun: the light source that motivates the terminator -->
  <circle cx="846" cy="192" r="190" fill="url(#C_sunglow)"/>
  <circle cx="846" cy="192" r="54" fill="url(#C_sun)"/>

  <!-- back half of the ring, drawn before the planet -->
  <g transform="rotate(-17 500 566)">
    <ellipse cx="500" cy="566" rx="446" ry="116" fill="none"
             stroke="url(#C_ring)" stroke-width="30"/>
    <ellipse cx="500" cy="566" rx="360" ry="93" fill="none"
             stroke="url(#C_ring)" stroke-width="12" opacity="0.55"/>
  </g>

  <circle cx="500" cy="536" r="272" fill="url(#C_planet)"/>

  <!-- banded atmosphere, clipped to the disc -->
  <g clip-path="url(#C_disc)" opacity="0.4">
    <ellipse cx="500" cy="410" rx="330" ry="34" fill="#FFE6B4"/>
    <ellipse cx="500" cy="520" rx="330" ry="26" fill="#B04C24"/>
    <ellipse cx="500" cy="626" rx="330" ry="38" fill="#FFD79A" opacity="0.7"/>
  </g>

  <!-- front half of the ring, passing over the planet's lower limb -->
  <g transform="rotate(-17 500 566)" clip-path="url(#C_front)">
    <ellipse cx="500" cy="566" rx="446" ry="116" fill="none"
             stroke="url(#C_ring)" stroke-width="30"/>
    <ellipse cx="500" cy="566" rx="360" ry="93" fill="none"
             stroke="url(#C_ring)" stroke-width="12" opacity="0.55"/>
  </g>
</svg>
