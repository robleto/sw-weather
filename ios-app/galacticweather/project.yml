name: galacticweather
options:
  bundleIdPrefix: com.robleto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Secrets.xcconfig
  Release: Config/Secrets.xcconfig
packages:
  # Analytics. Pinned to the 2.x line — 3.0 is in beta as of August 2026, and
  # there is nothing in it this app needs. See Services/Analytics.swift for
  # what is actually sent; the SDK does nothing at all unless
  # TELEMETRYDECK_APP_ID is set in Config/Secrets.xcconfig.
  TelemetryDeck:
    url: https://github.com/TelemetryDeck/SwiftSDK
    from: 2.14.2
targets:
  galacticweather:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: galacticweather
    dependencies:
      - package: TelemetryDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.galacticweather
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: galacticweather/Info.plist
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: Config/galacticweather.entitlements
    info:
      path: galacticweather/Info.plist
      properties:
        CFBundleDisplayName: "Galactic Weather"
        # Without these two, XcodeGen injects its own defaults of "1.0" and "1"
        # into the generated Info.plist, and a literal in the plist outranks the
        # build setting. Bumping CURRENT_PROJECT_VERSION then renamed the archive
        # — archive.sh greps project.yml for the filename — while the bundle
        # inside stayed stamped build 1, and App Store Connect only rejects the
        # duplicate after the upload finishes.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
        # The app's layout (full-bleed portrait planet art, vertically
        # stacked text) is portrait-only by design. iOS requires supporting
        # every orientation UNLESS the app opts into "requires full screen" —
        # this is that opt-in, and it's what silences the Xcode warning
        # "All interface orientations must be supported unless the app
        # requires full screen."
        UIRequiresFullScreen: true
        # Export compliance, declared here so App Store Connect stops asking.
        #
        # Without this key every upload lands in "Missing Compliance" and cannot
        # go to a tester until someone clicks through the encryption
        # questionnaire — a gate that stalls a build for no reason once the
        # answer is known and unchanging.
        #
        # False is the accurate answer, not a shortcut. The app implements no
        # encryption of its own: every linked library is Apple's, HTTPS goes
        # through URLSession, and the only crypto framework present is Apple's
        # own CryptoKit (weak-linked, used by TelemetryDeck to hash
        # identifierForVendor — and hashing is not encryption anyway). There is
        # no OpenSSL, libsodium, CryptoSwift or BoringSSL in the binary. That
        # puts it squarely inside the exemption for apps that only use the
        # encryption iOS provides.
        #
        # Revisit if the app ever bundles its own crypto or does end-to-end
        # encryption of user data — at which point this becomes a wrong answer
        # rather than a stale one.
        ITSAppUsesNonExemptEncryption: false
        NSLocationWhenInUseUsageDescription: "Galactic Weather uses your location to show today's forecast and match it to a world."
        OPENWEATHERMAP_API_KEY: "$(OPENWEATHERMAP_API_KEY)"
        # Absent from Secrets.xcconfig means analytics stays off entirely —
        # see Services/Analytics.swift.
        TELEMETRYDECK_APP_ID: "$(TELEMETRYDECK_APP_ID)"
        UIAppFonts:
          - PoiretOne-Regular.ttf
          - RussoOne-Regular.ttf
  galacticweatherTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: galacticweatherTests
      # The cross-platform parity fixture, shared with the web app's vitest
      # suite. Referenced in place rather than copied into the iOS tree, so the
      # bundled copy is regenerated from the real file on every build and the
      # two platforms cannot be checked against different versions of it.
      - path: ../../shared/weather-slot-matrix.json
        buildPhase: resources
      # The analytics contract, shared the same way and for the same reason.
      - path: ../../shared/analytics-signals.json
        buildPhase: resources
    dependencies:
      - target: galacticweather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.robleto.galacticweatherTests
        DEVELOPMENT_TEAM: WNJ76895SD
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
fileGroups:
  - Config/galacticweather.entitlements
  - StoreKitConfig/Products.storekit
schemes:
  galacticweather:
    build:
      targets:
        galacticweather: all
        galacticweatherTests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKitConfig/Products.storekit
    test:
      config: Debug
      targets:
        - galacticweatherTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
